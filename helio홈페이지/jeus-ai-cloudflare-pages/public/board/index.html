<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>문의하기 | Jeus.ai</title>
<meta name="description" content="Jeus.ai 도입 문의 게시판 — 전화번호·이메일·제목·문의 내용을 남겨 주시면 빠르게 답변드립니다." />
<link rel="icon" href="/favicon.svg" />
<link rel="canonical" href="https://jeus.ai.kr/board/" />
<meta property="og:type" content="website" />
<meta property="og:title" content="문의하기 | Jeus.ai" />
<meta property="og:url" content="https://jeus.ai.kr/board/" />
<style>
  :root{--sky:#1fa8f0;--sky-deep:#0c79bf;--green:#1c9b64;--amber:#c77d12;--coral:#df5b4f;--ink:#121820;--sub:#5d6876;--muted:#8a96a5;--line:#e8edf2;--band:#f7fbfe;}
  *{box-sizing:border-box;}
  body{margin:0;background:#fff;color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;line-height:1.6;}
  a{color:inherit;text-decoration:none;}
  .nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:62px;padding:0 32px;border-bottom:1px solid rgba(232,237,242,.9);background:rgba(255,255,255,.94);backdrop-filter:blur(14px);}
  .nav .logo{font-size:20px;font-weight:850;}
  .nav .logo span{color:var(--sky-deep);}
  .nav-right{display:flex;gap:16px;align-items:center;font-size:14px;font-weight:650;color:var(--sub);}
  .wrap{max-width:920px;margin:0 auto;padding:44px 24px 80px;}
  .eyebrow{color:var(--sky-deep);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12.5px;margin:0 0 10px;}
  h1{font-size:32px;margin:0 0 8px;letter-spacing:-.02em;}
  .sub{color:var(--sub);margin:0 0 26px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 20px;border-radius:8px;background:var(--sky);color:#fff;font-weight:800;border:none;cursor:pointer;box-shadow:0 10px 22px rgba(31,168,240,.2);font-size:15px;}
  .btn.ghost{background:transparent;color:var(--sky-deep);box-shadow:none;border:1px solid var(--line);}
  .btn.sm{min-height:34px;padding:0 14px;font-size:13px;}
  .card{border:1px solid var(--line);border-radius:14px;padding:22px;background:#fff;margin-bottom:22px;box-shadow:0 8px 24px rgba(18,24,32,.04);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px;}
  .field label .req{color:var(--coral);}
  .field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;}
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(31,168,240,.12);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .privacy{font-size:12.5px;color:var(--muted);margin-top:6px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:30px 0 12px;}
  .toolbar h2{font-size:20px;margin:0;}
  table{width:100%;border-collapse:collapse;font-size:14.5px;}
  th,td{border-bottom:1px solid var(--line);padding:12px 10px;text-align:left;}
  th{color:var(--muted);font-size:12.5px;font-weight:700;background:var(--band);}
  td.c,th.c{text-align:center;width:90px;}
  tr.q{cursor:pointer;}
  tr.q:hover{background:var(--band);}
  .status{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 11px;}
  .status.wait{background:rgba(199,125,18,.13);color:var(--amber);}
  .status.done{background:rgba(28,155,100,.13);color:var(--green);}
  .detail{background:var(--band);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:8px;}
  .detail h3{margin:0 0 6px;font-size:17px;}
  .detail .meta{font-size:12.5px;color:var(--muted);margin-bottom:12px;}
  .detail .content{white-space:pre-wrap;font-size:14.5px;color:var(--ink);}
  .reply{margin-top:14px;border-left:3px solid var(--sky);background:#fff;border-radius:8px;padding:14px;}
  .reply .who{font-weight:800;color:var(--sky-deep);font-size:13px;margin-bottom:4px;}
  .reply .content{white-space:pre-wrap;font-size:14px;}
  .admin-box{background:#0c1320;color:#dfe8f3;border-radius:8px;padding:8px 10px;}
  .empty{color:var(--muted);text-align:center;padding:26px;}
  .msg{padding:12px 14px;border-radius:9px;font-size:14px;margin-bottom:14px;display:none;}
  .msg.ok{background:rgba(28,155,100,.12);color:var(--green);display:block;}
  .msg.err{background:rgba(223,91,79,.12);color:var(--coral);display:block;}
  .adminbar{display:none;align-items:center;gap:10px;background:#0c1320;color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:13.5px;}
  .adminbar.on{display:flex;}
  .adminbar .dot{width:8px;height:8px;border-radius:50%;background:#3fb97a;}
  .contact-fields{display:none;}
  .contact-fields.show{display:block;}
  @media(max-width:680px){.row2{grid-template-columns:1fr;}td.hide-m,th.hide-m{display:none;}}
</style>
</head>
<body>
  <nav class="nav">
    <a class="logo" href="/">Jeus<span>.ai</span></a>
    <div class="nav-right">
      <a href="/solution/">솔루션 소개</a>
      <a href="/#demo">라이브 데모</a>
      <a href="#" id="admin-link">관리자</a>
    </div>
  </nav>

  <div class="wrap">
    <p class="eyebrow">Contact</p>
    <h1>문의하기</h1>
    <p class="sub">도입·PoC·기능 문의를 남겨 주세요. 남겨 주신 연락처로 담당자가 회신드립니다.</p>

    <div class="adminbar" id="adminbar">
      <span class="dot"></span><b>관리자 모드</b> — 연락처와 문의 내용을 확인하고 답변을 등록할 수 있습니다.
      <button class="btn ghost sm" id="admin-logout" style="margin-left:auto;color:#fff;border-color:#33405a">로그아웃</button>
    </div>

    <div class="card" id="form-card">
      <div class="msg" id="form-msg"></div>
      <div class="row2">
        <div class="field"><label>이름 / 회사 <span class="req">*</span></label><input id="f-name" maxlength="40" placeholder="홍길동 / 헬리오소프트" /></div>
        <div class="field"><label>전화번호 <span class="req">*</span></label><input id="f-phone" maxlength="20" placeholder="010-1234-5678" /></div>
      </div>
      <div class="field"><label>이메일 <span class="req">*</span></label><input id="f-email" type="email" maxlength="80" placeholder="you@company.com" /></div>
      <div class="field"><label>제목 <span class="req">*</span></label><input id="f-title" maxlength="80" placeholder="FinOps 도입 문의" /></div>
      <div class="field"><label>문의 내용 <span class="req">*</span></label><textarea id="f-content" rows="5" maxlength="2000" placeholder="현재 AI 운영 환경, 관심 기능, 일정 등을 적어주세요."></textarea></div>
      <button class="btn" id="f-submit">문의 등록</button>
      <p class="privacy">· 전화번호·이메일은 답변 목적 외에 사용되지 않으며, 목록에는 공개되지 않습니다.<br>· 비밀번호·계좌 등 민감정보는 적지 말아 주세요.</p>
    </div>

    <div class="toolbar"><h2>문의 목록</h2><button class="btn ghost sm" id="refresh">새로고침</button></div>
    <table>
      <thead><tr><th class="c">번호</th><th>제목</th><th class="hide-m">작성자</th><th class="c hide-m">작성일</th><th class="c">상태</th></tr></thead>
      <tbody id="list"><tr><td colspan="5" class="empty">불러오는 중…</td></tr></tbody>
    </table>
  </div>

<script>
const $=s=>document.querySelector(s);
let ADMIN=sessionStorage.getItem("jeus_admin")||"";
let openId=null;

function maskName(n){ if(!n) return "익명"; const t=n.trim(); return t.length<=1?t+"*":t[0]+"*".repeat(Math.min(3,t.length-1)); }
function fmt(ts){ const d=new Date(ts); const p=x=>String(x).padStart(2,"0"); return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`; }
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function setAdmin(on){
  $("#adminbar").classList.toggle("on",on);
  $("#admin-link").textContent = on? "관리자 ✓" : "관리자";
}

async function api(path,opts){
  opts=opts||{}; opts.headers=opts.headers||{};
  if(ADMIN) opts.headers["X-Admin-Token"]=ADMIN;
  const r=await fetch(path,opts);
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||("오류 "+r.status));
  return d;
}

async function load(){
  try{
    const d=await api("/api/inquiries");
    const rows=d.rows||[];
    if(!rows.length){ $("#list").innerHTML='<tr><td colspan="5" class="empty">아직 등록된 문의가 없습니다. 첫 문의를 남겨 보세요.</td></tr>'; return; }
    $("#list").innerHTML=rows.map((q,i)=>`
      <tr class="q" data-id="${esc(q.id)}">
        <td class="c">${rows.length-i}</td>
        <td>${esc(q.title)} ${q.answered?'<span class="status done">답변완료</span>':''}</td>
        <td class="hide-m">${esc(q.author)}</td>
        <td class="c hide-m">${fmt(q.created)}</td>
        <td class="c">${q.answered?'<span class="status done">완료</span>':'<span class="status wait">대기</span>'}</td>
      </tr>
      <tr id="d-${esc(q.id)}"></tr>`).join("");
    document.querySelectorAll("tr.q").forEach(tr=>tr.onclick=()=>toggle(tr.dataset.id));
  }catch(e){ $("#list").innerHTML=`<tr><td colspan="5" class="empty">목록을 불러오지 못했습니다: ${esc(e.message)}</td></tr>`; }
}

async function toggle(id){
  const cell=$("#d-"+CSS.escape(id));
  if(openId===id){ cell.innerHTML=""; openId=null; return; }
  document.querySelectorAll("[id^='d-']").forEach(c=>c.innerHTML="");
  openId=id;
  try{
    const d=await api("/api/inquiries/"+encodeURIComponent(id));
    const q=d.inquiry;
    let contact="";
    if(ADMIN && (q.phone||q.email)) contact=`<div class="meta">📞 ${esc(q.phone||"-")} · ✉ ${esc(q.email||"-")}</div>`;
    let reply = q.reply ? `<div class="reply"><div class="who">관리자 답변 · ${q.reply_at?fmt(q.reply_at):""}</div><div class="content">${esc(q.reply)}</div></div>` : "";
    let adminForm="";
    if(ADMIN){
      adminForm=`<div style="margin-top:12px">
        <textarea id="r-${esc(id)}" rows="3" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:inherit;font-size:14px" placeholder="답변을 입력하세요">${esc(q.reply||"")}</textarea>
        <button class="btn sm" style="margin-top:8px" onclick="reply('${esc(id)}')">${q.reply?"답변 수정":"답변 등록"}</button>
        <button class="btn ghost sm" style="margin-top:8px;margin-left:8px;color:#c0392b;border-color:#e3b7b1" onclick="del('${esc(id)}')">문의 삭제</button>
      </div>`;
    }
    cell.innerHTML=`<td colspan="5"><div class="detail">
      <h3>${esc(q.title)}</h3>
      <div class="meta">${esc(maskAuthorOrFull(q))} · ${fmt(q.created)}</div>
      ${contact}
      <div class="content">${esc(q.content)}</div>
      ${reply}
      ${adminForm}
    </div></td>`;
  }catch(e){ cell.innerHTML=`<td colspan="5"><div class="detail">상세를 불러오지 못했습니다: ${esc(e.message)}</div></td>`; }
}
function maskAuthorOrFull(q){ return ADMIN ? (q.name||"익명") : maskName(q.name); }

async function reply(id){
  const v=$("#r-"+CSS.escape(id)).value.trim();
  if(!v){ alert("답변 내용을 입력하세요"); return; }
  try{ await api("/api/inquiries/"+encodeURIComponent(id)+"/reply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reply:v})});
    openId=null; await load(); alert("답변이 등록되었습니다.");
  }catch(e){ alert("등록 실패: "+e.message); }
}
window.reply=reply;

async function del(id){
  if(!confirm("이 문의를 삭제할까요? 삭제하면 되돌릴 수 없습니다.")) return;
  try{
    await api("/api/inquiries/"+encodeURIComponent(id),{method:"DELETE"});
    openId=null; await load(); alert("문의가 삭제되었습니다.");
  }catch(e){ alert("삭제 실패: "+e.message); }
}
window.del=del;

$("#f-submit").onclick=async()=>{
  const body={name:$("#f-name").value.trim(),phone:$("#f-phone").value.trim(),email:$("#f-email").value.trim(),title:$("#f-title").value.trim(),content:$("#f-content").value.trim()};
  const m=$("#form-msg"); m.className="msg";
  if(!body.name||!body.phone||!body.email||!body.title||!body.content){ m.className="msg err"; m.textContent="모든 항목을 입력해 주세요."; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(body.email)){ m.className="msg err"; m.textContent="이메일 형식을 확인해 주세요."; return; }
  $("#f-submit").disabled=true;
  try{
    await api("/api/inquiries",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    m.className="msg ok"; m.textContent="문의가 등록되었습니다. 담당자가 빠르게 회신드리겠습니다.";
    ["f-name","f-phone","f-email","f-title","f-content"].forEach(id=>$("#"+id).value="");
    await load();
  }catch(e){ m.className="msg err"; m.textContent="등록 실패: "+e.message; }
  finally{ $("#f-submit").disabled=false; }
};

async function adminLogin(){
  const pw=prompt("관리자 비밀번호를 입력하세요");
  if(pw===null) return;
  try{
    await api("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json","X-Admin-Token":pw},body:"{}"});
    ADMIN=pw; sessionStorage.setItem("jeus_admin",pw); setAdmin(true); openId=null; await load();
  }catch(e){ alert("로그인 실패: 비밀번호를 확인하세요."); }
}
$("#admin-link").onclick=(e)=>{e.preventDefault(); if(ADMIN){return;} adminLogin();};
$("#admin-logout").onclick=()=>{ ADMIN=""; sessionStorage.removeItem("jeus_admin"); setAdmin(false); openId=null; load(); };
$("#refresh").onclick=load;

// init
setAdmin(!!ADMIN);
if(new URLSearchParams(location.search).get("admin")==="1" && !ADMIN) adminLogin();
load();
</script>
</body>
</html>
